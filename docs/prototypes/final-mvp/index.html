<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ПРАНТЕ — прототип</title>
  <link rel="icon" type="image/png" href="assets/prante-icon-teal.png" />
  <style>
    :root {
      color-scheme: light;
      --theme-page-start: #F7F3EC;
      --theme-page-end: #F4F1EA;
      --theme-ink: #2B2F33;
      --theme-muted: #66727C;
      --theme-line: rgba(43,47,51,.12);
      --theme-accent: #2F88D8;
      --theme-accent-strong: #226FAE;
      --theme-avatar-bg: #FDFBF8;
      --theme-avatar-ring: #D9DEDF;
      --theme-avatar-logo-scale: 80%;
      --theme-avatar-logo-y: 42%;
      --theme-phone-start: #26333F;
      --theme-phone-end: #1D2832;
      --theme-page: var(--theme-page-end);
      --page: var(--theme-page-end);
      --ink: var(--theme-ink);
      --muted: var(--theme-muted);
      --line: var(--theme-line);
      --accent: var(--theme-accent);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background:
        radial-gradient(60% 50% at 50% -10%, rgba(255,255,255,.75), transparent 70%),
        linear-gradient(180deg, var(--theme-page-start), var(--theme-page-end));
      color: var(--ink);
      font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 16px 22px;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      font-weight: 700; letter-spacing: -.02em; font-size: 15px;
    }
    .brand .mark {
      width: 28px; height: 28px; border-radius: 8px;
      background: var(--theme-avatar-bg);
      color: transparent;
      display: grid; place-items: center; font-size: 13px; font-weight: 700;
      box-shadow: inset 0 0 0 0.5px rgba(0,0,0,.08), 0 0 0 1px var(--theme-avatar-ring);
      overflow: hidden;
    }
    .brand .mark img {
      width: var(--theme-avatar-logo-scale); height: var(--theme-avatar-logo-scale);
      object-fit: contain; object-position: center var(--theme-avatar-logo-y); display:block;
    }
    .brand .tag {
      color: var(--muted); font-weight: 500; font-size: 13px;
      padding-left: 10px; margin-left: 4px; border-left: 1px solid var(--line);
    }
    .controls { display: flex; align-items: center; gap: 6px; }
    .ctrl {
      font: inherit; cursor: pointer; appearance: none;
      background: rgba(255,255,255,.7); border: 1px solid var(--line);
      color: var(--theme-ink); border-radius: 999px;
      padding: 8px 14px; font-size: 13px; font-weight: 500;
      display: inline-flex; align-items: center; gap: 6px;
      backdrop-filter: blur(8px);
      transition: background .15s;
    }
    .ctrl:hover { background: rgba(255,255,255,.95); }
    .ctrl.primary { background: var(--theme-accent-strong); color: #fff; border-color: var(--theme-accent-strong); }
    .ctrl.primary:hover { background: #000; }
    .ctrl svg { display: block; }

    .stage {
      position: fixed; inset: 0;
      display: grid; place-items: center;
      padding: 80px 24px 32px;
    }
    .frame-fit {
      position: relative;
    }
    .frame-scale {
      position: absolute; top: 0; left: 0;
      transform-origin: top left;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes tg-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: .4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }
    /* Telegram-iOS message enter: scale from tail corner + fade + tiny Y rise */
    @keyframes tg-msg-in {
      0%   { transform: scale(.42) translateY(10px); opacity: 0; }
      55%  { opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    @keyframes tg-typing-in {
      0%   { transform: scale(.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes tg-typing-out {
      0%   { transform: scale(1); opacity: 1; }
      100% { transform: scale(.6); opacity: 0; }
    }
    .tg-msg {
      animation: tg-msg-in .34s cubic-bezier(.16,1,.3,1) both;
      will-change: transform, opacity;
    }
    .tg-msg-user { transform-origin: 100% 100%; }
    .tg-msg-bot  { transform-origin: 0% 100%; }
    .tg-msg-center { transform-origin: 50% 100%; }
    .tg-typing {
      animation: tg-typing-in .22s cubic-bezier(.16,1,.3,1) both;
      transform-origin: 0% 100%;
    }
    @keyframes thinking-bounce {
      0%, 100% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.18) rotate(-6deg); }
      75% { transform: scale(1.18) rotate(6deg); }
    }
    .thinking-emoji {
      animation: thinking-bounce 1.1s ease-in-out infinite;
      transform-origin: center 60%;
    }
    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(.6); opacity: .55; }
    }
    .pulse-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--theme-accent); display: inline-block;
      animation: pulse-dot 1s ease-in-out infinite;
    }
    /* animated trailing "..." for thinking/active headers */
    @keyframes ell-dot {
      0%, 80%, 100% { opacity: .2; }
      40% { opacity: 1; }
    }
    .ellipsis-dots { display: inline-block; margin-left: 1px; letter-spacing: 1px; }
    .ellipsis-dots span {
      display: inline-block; opacity: .2;
      animation: ell-dot 1.4s ease-in-out infinite;
    }
    .ellipsis-dots span:nth-child(2) { animation-delay: .2s; }
    .ellipsis-dots span:nth-child(3) { animation-delay: .4s; }

    body.reduced * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    /* hide scrollbar inside the phone chat */
    .tg-scroll { scrollbar-width: none; -ms-overflow-style: none; }
    .tg-scroll::-webkit-scrollbar { width: 0; height: 0; display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="content/content-adapter.js?v=20260525-editor"></script>
  <script type="text/babel" src="ios-frame.jsx?v=20260525-editor"></script>
  <script type="text/babel" src="app.jsx?v=20260525-editor"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useLayoutEffect } = React;
    const PHONE_W = 390, PHONE_H = 820;

    function applyThemeVars(vars) {
      if (!vars || typeof vars !== 'object') return;
      Object.entries(vars).forEach(([key, value]) => {
        document.documentElement.style.setProperty(key, String(value));
      });
    }

    async function loadThemeVars() {
      try {
        const res = await fetch('content/theme-overrides.json', { cache: 'no-store' });
        if (!res.ok) return null;
        const data = await res.json();
        return data && data.vars ? data.vars : null;
      } catch (err) {
        console.warn('theme load failed', err);
        return null;
      }
    }

    function Shell() {
      const startFinal = new URLSearchParams(window.location.search).get('demo') === 'final';
      const [content, setContent] = useState(null);
      const [contentStatus, setContentStatus] = useState(null);
      const [runKey, setRunKey] = useState(0);
      const [skip, setSkip] = useState(startFinal);
      const [reduced, setReduced] = useState(false);
      const [scale, setScale] = useState(1);

      // Load content: Google Sheets first, local JSON fallback.
      useEffect(() => {
        PranteContentTools.loadMergedContent({ basePath: '.' })
          .then(result => {
            setContent(result.content);
            setContentStatus(result);
            window.PranteContentStatus = result;
            document.title = result.content?.meta?.title || 'ПРАНТЕ — прототип';
            window.dispatchEvent(new CustomEvent('prante-content-status', { detail: result }));
            if (result.errors.length) console.error('content validation errors', result.errors);
            if (result.warnings.length) console.warn('content validation warnings', result.warnings);
          })
          .catch(err => console.error('content load failed', err));
      }, []);

      // Fit-to-viewport scaling
      useLayoutEffect(() => {
        const compute = () => {
          // available area: viewport minus top bar (~64) minus bottom padding (32) minus side padding
          const w = window.innerWidth - 48;
          const h = window.innerHeight - 64 - 32;
          const s = Math.min(w / PHONE_W, h / PHONE_H, 1);
          setScale(s);
        };
        compute();
        window.addEventListener('resize', compute);
        return () => window.removeEventListener('resize', compute);
      }, []);

      useEffect(() => {
        document.body.classList.toggle('reduced', reduced);
      }, [reduced]);

      useEffect(() => {
        loadThemeVars().then(vars => vars && applyThemeVars(vars));
        const onMessage = (event) => {
          if (event?.data?.type === 'prante-theme-preview' && event.data.vars) {
            applyThemeVars(event.data.vars);
          }
        };
        window.addEventListener('message', onMessage);
        return () => window.removeEventListener('message', onMessage);
      }, []);

      return (
        <>
          <div className="topbar">
            <div className="brand">
              <div className="mark"><img src="assets/prante-logo-transparent.png" alt="" /></div>
              <span>ПРАНТЕ</span>
              <span className="tag">прототип Telegram-бота · MVP</span>
            </div>
            <div className="controls">
              <button className="ctrl" onClick={() => setReduced(r => !r)} title="меньше движения">
                {reduced ? 'Анимация: выкл' : 'Анимация: вкл'}
              </button>
              <button className="ctrl" onClick={() => { setSkip(true); setRunKey(k => k+1); }}>
                {content?.controls?.final || 'Сразу к финалу'}
              </button>
              <button className="ctrl primary" onClick={() => { setSkip(false); setRunKey(k => k+1); }}>
                <svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 1.5l7 4.5-7 4.5z" fill="currentColor"/></svg>
                {content?.controls?.restart || 'Запустить заново'}
              </button>
            </div>
          </div>

          <div className="stage">
            <div className="frame-fit" style={{ width: PHONE_W * scale, height: PHONE_H * scale }}>
              <div className="frame-scale" style={{ transform: `scale(${scale})`, width: PHONE_W, height: PHONE_H }}>
                {content && (
                  <IOSDevice width={PHONE_W} height={PHONE_H}>
                    <div style={{height:'100%', width:'100%', position:'relative'}}>
                      <PranteApp
                        content={content}
                        runKey={runKey}
                        skip={skip}
                        speed={reduced ? 6 : 1}
                      />
                    </div>
                  </IOSDevice>
                )}
              </div>
            </div>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Shell />);
  </script>
</body>
</html>
